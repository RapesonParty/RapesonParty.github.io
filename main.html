<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Code Consortium</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffee;
      --bg2: #d6daf0;
      --bg3: #eef2ff;
      --border: #b7c5d9;
      --post-bg: #f0e0d6;
      --post-border: #d9bfb7;
      --op-bg: #d6daf0;
      --reply-bg: #eef2ff;
      --accent: #800000;
      --accent2: #2f4f8a;
      --text: #1a1a1a;
      --muted: #666;
      --link: #800000;
      --green: #789922;
      --trip: #228b22;
      --header-bg: #af0a0f;
      --tag: #2f4f8a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 13px;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* HEADER */
    #site-header {
      background: var(--header-bg);
      color: white;
      text-align: center;
      padding: 10px 0 6px;
      border-bottom: 3px solid #6b0000;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    #site-header h1 {
      font-family: 'Courier Prime', monospace;
      font-size: 28px;
      letter-spacing: 4px;
      text-shadow: 1px 1px 0 #4a0000;
    }
    #site-header .tagline {
      font-size: 11px;
      opacity: 0.8;
      letter-spacing: 2px;
      margin-top: 2px;
    }
    #board-nav {
      margin-top: 6px;
      display: flex;
      justify-content: center;
      gap: 4px;
      flex-wrap: wrap;
      padding: 0 10px;
    }
    .board-tab {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      color: white;
      padding: 3px 12px;
      cursor: pointer;
      font-family: 'Courier Prime', monospace;
      font-size: 13px;
      border-radius: 2px;
      transition: background 0.15s;
    }
    .board-tab:hover { background: rgba(255,255,255,0.3); }
    .board-tab.active { background: white; color: var(--header-bg); font-weight: bold; }

    /* MAIN */
    #main {
      max-width: 900px;
      margin: 0 auto;
      padding: 16px 12px;
    }

    /* BOARD HEADER */
    .board-header {
      text-align: center;
      border-bottom: 2px solid var(--border);
      margin-bottom: 16px;
      padding-bottom: 10px;
    }
    .board-header h2 {
      font-family: 'Courier Prime', monospace;
      font-size: 22px;
      color: var(--accent2);
    }
    .board-header p { color: var(--muted); font-size: 11px; margin-top: 3px; }

    /* NEW THREAD FORM */
    .post-form-wrap {
      background: var(--op-bg);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 14px;
      margin-bottom: 20px;
    }
    .post-form-wrap h3 {
      font-family: 'Courier Prime', monospace;
      color: var(--accent2);
      font-size: 14px;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }
    .form-row {
      display: flex;
      gap: 8px;
      margin-bottom: 7px;
      align-items: center;
      flex-wrap: wrap;
    }
    .form-row label {
      width: 80px;
      color: var(--muted);
      font-size: 12px;
      flex-shrink: 0;
    }
    .form-row input[type=text], .form-row textarea {
      flex: 1;
      min-width: 0;
      padding: 5px 7px;
      border: 1px solid var(--border);
      background: white;
      font-family: inherit;
      font-size: 13px;
      border-radius: 2px;
      color: var(--text);
    }
    .form-row textarea {
      resize: vertical;
      height: 80px;
    }
    .form-row input[type=text]:focus,
    .form-row textarea:focus {
      outline: 1px solid var(--accent2);
    }
    .form-hint {
      font-size: 10px;
      color: var(--muted);
      margin-left: 88px;
      margin-bottom: 8px;
    }
    .form-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 4px;
      flex-wrap: wrap;
    }
    .sage-label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
    }
    .btn {
      background: var(--accent2);
      color: white;
      border: none;
      padding: 5px 18px;
      font-family: 'Courier Prime', monospace;
      font-size: 13px;
      cursor: pointer;
      border-radius: 2px;
      transition: background 0.15s;
    }
    .btn:hover { background: #1a3060; }
    .btn.danger { background: var(--accent); }
    .btn.danger:hover { background: #5a0000; }

    /* STATUS */
    #status-msg {
      text-align: center;
      padding: 8px;
      font-size: 12px;
      color: var(--muted);
      min-height: 24px;
    }

    /* THREADS */
    .thread {
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }

    /* OP POST */
    .op-post {
      display: flex;
      gap: 12px;
      margin-bottom: 10px;
    }
    .op-image {
      flex-shrink: 0;
    }
    .op-image img {
      max-width: 200px;
      max-height: 200px;
      border: 1px solid var(--border);
      display: block;
      cursor: pointer;
    }
    .op-image img.expanded {
      max-width: 100%;
      max-height: none;
    }
    .op-content { flex: 1; min-width: 0; }

    .post-header {
      margin-bottom: 5px;
      line-height: 1.8;
    }
    .post-subject {
      font-weight: bold;
      color: var(--accent2);
      font-size: 14px;
      margin-right: 6px;
    }
    .post-name {
      color: var(--accent);
      font-weight: bold;
      margin-right: 4px;
    }
    .post-trip {
      color: var(--trip);
      font-weight: bold;
      margin-right: 6px;
    }
    .post-time {
      color: var(--muted);
      font-size: 11px;
      margin-right: 6px;
    }
    .post-no {
      color: var(--muted);
      font-size: 11px;
      font-family: 'Courier Prime', monospace;
    }
    .post-no a {
      color: var(--muted);
      text-decoration: none;
    }
    .post-no a:hover { color: var(--accent2); text-decoration: underline; }

    .post-body {
      line-height: 1.6;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .post-body .greentext { color: var(--green); }
    .post-body .quotelink { color: var(--accent2); text-decoration: none; }
    .post-body .quotelink:hover { text-decoration: underline; }
    /* EMPTY */
    .empty-board {
      text-align: center;
      color: var(--muted);
      padding: 40px;
      font-style: italic;
    }

    /* CONFIG SCREEN */
    #config-screen {
      max-width: 600px;
      margin: 40px auto;
      padding: 24px;
      background: var(--op-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
    }
    #config-screen h2 {
      font-family: 'Courier Prime', monospace;
      color: var(--accent2);
      margin-bottom: 16px;
      font-size: 20px;
    }
    #config-screen p {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 16px;
      line-height: 1.6;
    }
    .config-row {
      margin-bottom: 12px;
    }
    .config-row label {
      display: block;
      font-weight: bold;
      margin-bottom: 4px;
      font-size: 12px;
      color: var(--accent2);
      font-family: 'Courier Prime', monospace;
    }
    .config-row input {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid var(--border);
      font-family: 'Courier Prime', monospace;
      font-size: 13px;
      border-radius: 2px;
    }
    .config-boards { margin: 16px 0; }
    .config-boards h3 {
      font-family: 'Courier Prime', monospace;
      font-size: 14px;
      color: var(--accent);
      margin-bottom: 10px;
    }

    /* FOOTER */
    footer {
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      padding: 20px;
      border-top: 1px solid var(--border);
      margin-top: 30px;
      font-family: 'Courier Prime', monospace;
    }

    @media (max-width: 600px) {
      .op-post { flex-direction: column; }
      .replies { margin-left: 16px; }
      .reply-form-wrap { margin-left: 16px; }
      .thread-actions { margin-left: 16px; }
    }
  </style>
</head>
<body>
<!-- MAIN SITE -->
<div id="site" style="display:none">
  <header id="site-header">
    <h1>The Code Consortium</h1>
    <div class="tagline">your friendly neighborhood textboard</div>
    <nav id="board-nav"></nav>
  </header>

  <div id="main">
    <div class="board-header">
      <h2 id="board-title"></h2>
      <p id="board-desc"></p>
    </div>
// ─── INIT ─────────────────────────────────────────────────────────
document.getElementById('site').style.display = 'block';
initSite();
</script>
</body>
</html>
